<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1-1" />
  <title>Mi Proyecto WebAR con 3 Marcadores</title>
  <!-- Librerías oficiales de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- Escena configurada con tus 3 archivos .mind cargados correctamente -->
  <a-scene 
    mindar-image="imageTargetSrc: ./marcador1.mind, ./marcador2.mind, ./marcador3.mind;" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Precarga de tus 3 modelos 3D exportados de Blender -->
      <a-asset-item id="modelo1" src="rocoso.glb"></a-asset-item>
      <a-asset-item id="modelo2" src="rocoso.glb"></a-asset-item>
      <a-asset-item id="modelo3" src="rocoso.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- MARCADOR 1 (Índice 0) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#modelo1" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 180 0"></a-gltf-model>
    </a-entity>

    <!-- MARCADOR 2 (Índice 1) -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#modelo2" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 180 0"></a-gltf-model>
    </a-entity>

    <!-- MARCADOR 3 (Índice 2) -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#modelo3" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 180 0"></a-gltf-model>
    </a-entity>

  </a-scene>
</body>
</html>
